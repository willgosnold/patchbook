[project]
name = "patchbook"
version = "0.1.0"
description = "Keep your changes to an upstream repo, each with its intent, and keep pulling from upstream."
requires-python = ">=3.11"

[project.scripts]
patchbook = "patchbook:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["patchbook"]
