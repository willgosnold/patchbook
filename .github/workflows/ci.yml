name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.user }}, ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS runners queue for minutes and run about 2.5x slower, so pull
        # requests test on Ubuntu only. Pushes to main (and manual runs, for
        # checking a branch on macOS before merging) test on both.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
        # The tests run once as the runner user and once as root. Root runs
        # on Ubuntu only, for the same reason.
        user: [runner, root]
        # The end-to-end tests are nearly all the run time, so they are split
        # by file across parallel jobs. "fork" runs test/e2e/fork*.test.ts,
        # "vendor" runs test/e2e/vendor*.test.ts, and "rest" runs every other
        # file there, so a new file lands in "rest".
        shard: [fork, vendor, rest]
        exclude:
          - { os: macos-latest, user: root }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - name: The compiled binary carries no crash-injection code
        run: bun test/crash-build.ts check dist/patchbook
      # Root ignores file permissions, so a test that needs a refused write must be skipped by permissionTest. One that is not fails the root jobs.
      # The "rest" shard also runs every test file in test/ but the e2e ones
      # from source, then the e2e describes that skip under PATCHBOOK_CMD. Each
      # unit file gets a fresh module registry: units.test.ts needs settings.ts
      # loaded under its own sandbox.
      - name: Tests as ${{ matrix.user }}
        run: |
          as=()
          if [ "$USER_KIND" = root ]; then as=(sudo env "PATH=$PATH" HOME=/root); fi
          "${as[@]}" bash -euxo pipefail -c '
            [ "$([ "$(id -u)" = 0 ] && echo root || echo runner)" = "$1" ]
            if [ "$2" = rest ]; then
              files=($(ls test/e2e/*.test.ts | grep -Ev "/(fork|vendor)[^/]*$"))
              bun test --isolate test/*.test.ts
              bun test test/e2e/*.test.ts --test-name-pattern "so only from source"
            else
              files=(test/e2e/"$2"*.test.ts)
            fi
            [ -e "${files[0]}" ]
            PATCHBOOK_CMD="$PWD/dist/patchbook" bun test "${files[@]}"
          ' bash "$USER_KIND" "$SHARD"
        env:
          USER_KIND: ${{ matrix.user }}
          SHARD: ${{ matrix.shard }}

  # main's ruleset requires a check named "test (ubuntu-latest)". This job
  # gives that name one result for the whole matrix above.
  required:
    name: test (ubuntu-latest)
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.test.result }}
