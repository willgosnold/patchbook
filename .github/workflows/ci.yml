name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.shard.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS runners queue for minutes and run about 2.5x slower, so pull
        # requests test on Ubuntu only. Pushes to main (and manual runs, for
        # checking a branch on macOS before merging) test on both.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
        # The end-to-end tests are nearly all the run time, so they are split
        # by top-level describe block across parallel jobs. The three patterns
        # cover every test exactly once; a new top-level describe block lands
        # in "rest".
        shard:
          - { name: fork, pattern: "^ForkTest " }
          - { name: vendor, pattern: "^VendorTest " }
          - { name: rest, pattern: "^(?!ForkTest |VendorTest )" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # Every test file except e2e, which runs below against the compiled
      # binary that ships. Each file gets a fresh module registry:
      # units.test.ts needs settings.ts loaded under its own sandbox.
      - name: Unit tests
        if: matrix.shard.name == 'rest'
        run: bun test --isolate $(ls test/*.test.ts | grep -v '/e2e\.test\.ts$')
      - run: bun run build
      - name: The compiled binary carries no crash-injection code
        run: bun test/crash-build.ts check dist/patchbook
      - name: End-to-end tests against the compiled binary
        run: bun test test/e2e.test.ts --test-name-pattern "$PATTERN"
        env:
          PATCHBOOK_CMD: ${{ github.workspace }}/dist/patchbook
          PATTERN: ${{ matrix.shard.pattern }}

  test-root:
    name: test (root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Root ignores file permissions, so a test that needs a refused write must be skipped by permissionTest. One that is not fails here.
      - name: Tests as root, from source and against the compiled binary
        run: |
          sudo env "PATH=$PATH" HOME=/root bash -euxo pipefail -c '
            [ "$(id -u)" = 0 ]
            bun test --isolate
            PATCHBOOK_CMD="$PWD/dist/patchbook" bun test test/e2e.test.ts
          '

  qa:
    name: qa (fake model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run qa

  # main's ruleset requires a check named "test (ubuntu-latest)". This job
  # gives that name one result for the whole matrix above and the root job.
  required:
    name: test (ubuntu-latest)
    if: always()
    needs: [test, test-root]
    runs-on: ubuntu-latest
    steps:
      - run: test "$RESULT" = success && test "$ROOT" = success
        env:
          RESULT: ${{ needs.test.result }}
          ROOT: ${{ needs.test-root.result }}
