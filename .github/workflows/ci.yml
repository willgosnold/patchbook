name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS runners queue for minutes and run about 2.5x slower, so pull
        # requests test on Ubuntu only. Pushes to main (and manual runs, for
        # checking a branch on macOS before merging) test on both.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # Each file gets a fresh module registry: units.test.ts needs settings.ts loaded under its own sandbox.
      - run: bun test --isolate
      - run: bun run build
      - name: End-to-end tests against the compiled binary
        run: bun test test/e2e.test.ts
        env:
          PATCHBOOK_CMD: ${{ github.workspace }}/dist/patchbook
