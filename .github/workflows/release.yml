name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.3

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Cross-compile every target
        run: bun scripts/build-release.ts --version "$VERSION"
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - name: Check the binary reports the tag's version
        run: |
          reported=$(dist/release/patchbook-linux-x64 --version)
          echo "$reported"
          grep -qF "$VERSION" <<<"$reported"
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  sign-darwin:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      # Bun's own ad-hoc signature is broken in some releases (oven-sh/bun#29120, #39764).
      - name: Re-sign and verify
        run: |
          set -euo pipefail
          cd release
          for binary in patchbook-darwin-*; do
            chmod +x "$binary"
            codesign --remove-signature "$binary"
            codesign --sign - --force "$binary"
            codesign --verify --strict --verbose=2 "$binary"
          done
          # This runner is arm64, so the x64 binary only gets the signature check.
          ./patchbook-darwin-arm64 --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: darwin-signed
          path: release/patchbook-darwin-*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [build, sign-darwin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: darwin-signed
          path: dist/release
      # Signing changed the darwin binaries, so the checksums from the build job are stale.
      - run: bun scripts/build-release.ts --checksums-only
      - name: Create the GitHub Release
        run: |
          flags=(--title "$GITHUB_REF_NAME" --generate-notes)
          [[ "$VERSION" == *-* ]] && flags+=(--prerelease)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/release/* "${flags[@]}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}

  npm:
    needs: [build, sign-darwin, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: darwin-signed
          path: dist/release
      - run: bun install --frozen-lockfile
      - name: Stage the packages
        run: bun scripts/gen-npm-packages.ts --version "$VERSION"
        env:
          VERSION: ${{ needs.build.outputs.version }}
      - name: Install the staged packages the way a user would
        run: scripts/smoke-npm.sh dist/npm linux-x64 "$VERSION"
        env:
          VERSION: ${{ needs.build.outputs.version }}
      - name: Publish the platform packages, then patchbook
        run: |
          tag=latest
          [[ "$VERSION" == *-* ]] && tag=next
          publish() {
            name=$(node -p "require('./$1/package.json').name")
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already published"
              return
            fi
            npm publish "$1" --provenance --access public --tag "$tag"
          }
          for dir in dist/npm/*/; do
            [[ "$dir" == dist/npm/patchbook/ ]] || publish "${dir%/}"
          done
          publish dist/npm/patchbook
        env:
          VERSION: ${{ needs.build.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
