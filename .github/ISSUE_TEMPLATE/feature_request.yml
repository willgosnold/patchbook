name: Idea or change
description: Propose a new command, flag or setting, or a change to how patchbook behaves.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Wait for a reply agreeing to the direction before you write code for this. See CONTRIBUTING.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you were trying to do, and where patchbook got in the way. Describe the problem, not only the fix you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you'd like patchbook to do. Say if it changes the files patchbook writes, its JSON output, its flags or its exit codes.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do now
      description: How you work around it today, if you do.
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to write the PR?
      options:
        - "Yes"
        - "Maybe, with some guidance"
        - "No"
